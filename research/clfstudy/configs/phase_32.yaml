phase: 32
description: '019 CURIOSITY probe (NOT a gate, NOT a decision input -- phase 5 covers
  combinations properly). Production LSTM is Dense->Conv1d(k2)->LN->residual->LSTM->LN->bottleneck->softmax;
  the study LSTM_FAM is a pure stacked LSTM with none of that. Scores production and
  its existing LSTM_NOCONV / LSTM_NORES ablations against LSTM_FAM at seq_len 64 on
  forward_mae, window A only. Width parity is incidental but real: production is max(MIN_FILTER=32,
  npo2(8-1)) = 32 filters, the same as LSTM_FAM hidden 32. Depth is NOT matched --
  production has ONE LSTM layer, so depth-1 LSTM_FAM is included as the like-for-like
  plain comparator and depth-2 (already run in phase 29) as the ladder reference.'
gate_from: 29
